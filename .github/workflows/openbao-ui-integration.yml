name: Codestra Platform UI integration checks
on:
  pull_request:
    paths:
      - "src/routes/OpenBaoReadiness.tsx"
      - "src/routes/__tests__/OpenBaoReadiness.test.tsx"
      - "src/mission-control/**"
      - "src/App.tsx"
      - "src/routes/MissionControl.tsx"
      - "vite.config.ts"
      - ".github/workflows/openbao-ui-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-contract:
    name: OpenBao / frontend-build-and-interactions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Use reviewed Node 22 toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.3"
          cache: npm
      - name: Install locked dependencies including native optional bindings
        run: npm ci --include=optional --no-audit --no-fund
      - name: Verify TypeScript and production bundle
        run: npm run build
      - name: Exercise read-only frontend interactions
        run: npm test -- --configLoader native
      - name: Preserve non-deploying scope
        run: |
          echo "OPENBAO_FRONTEND_API_INTERACTIONS=TESTED"
          echo "STAGING_GO=NO"
          echo "PRODUCTION_GO=NO"
          echo "No vault secrets, unseal, policy write, or production deployment was performed."
